name: Build and Release Clients

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: dart-lang/setup-dart@v1

      - name: Activate pub_version_plus
        run: dart pub global activate pub_version_plus

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bump patch version
        working-directory: ./client
        run: pubversion patch
          
      - name: Get version
        id: get_version
        working-directory: ./client
        run: |
          VERSION=$(grep "^version:" client/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Commit bumped version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add client/pubspec.yaml
          git commit -m "chore: bump client version to ${{ steps.get_version.outputs.version }}" || echo "No changes to commit"
          git push
